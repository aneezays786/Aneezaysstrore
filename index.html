<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aneezay's — Owner Panel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f7f2ec;color:#28221f;font-family:'DM Sans',Arial}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.brand{font:600 34px 'Playfair Display',serif}.muted{color:#766c66;font-size:13px}.login{max-width:420px;margin:70px auto;background:#fffdf9;border:1px solid #e8dfd7;padding:30px}.login h1{font:500 38px 'Playfair Display',serif}.login input{display:block;width:100%;padding:13px;border:1px solid #e8dfd7;margin:8px 0 15px}.primary{background:#28221f;color:#fff;border:0;padding:12px 16px;cursor:pointer;width:100%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.stat,.panel{background:#fffdf9;border:1px solid #e8dfd7;padding:20px}.stat b{font:600 28px 'Playfair Display',serif;display:block;margin-top:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar button,.toolbar select,.logout{font:inherit;border:1px solid #e8dfd7;background:#fffdf9;padding:10px 14px;cursor:pointer}.logout{float:right}.order{border-top:1px solid #e8dfd7;padding:20px 0}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 9px;background:#f7f2ec;font-size:11px}.items{margin:12px 0;color:#766c66;font-size:12px;line-height:1.7}.order select{border:1px solid #e8dfd7;background:#fffdf9;padding:9px}.danger{color:#9a3b3b}.hidden{display:none!important}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.brand{font-size:28px}}
</style></head><body><div class="wrap"><div id="loginView" class="login"><div class="brand">Aneezay's</div><p class="muted">Owner login</p><h1>Orders dashboard</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Sign in</button></form><p id="loginError" class="danger"></p></div><div id="dashboard" class="hidden"><button class="logout" id="logout">Log out</button><div class="brand">Aneezay's · Owner Panel</div><p class="muted">Private dashboard for your store orders.</p><div class="stats"><div class="stat"><span class="muted">Total orders</span><b id="totalOrders">0</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">0</b></div><div class="stat"><span class="muted">Confirmed</span><b id="confirmed">0</b></div><div class="stat"><span class="muted">Delivered</span><b id="delivered">0</b></div></div><div class="panel"><div class="toolbar"><select id="statusFilter"><option>All</option><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button id="refresh">Refresh</button></div><div id="orders"><p class="muted">Loading…</p></div></div></div></div><script type="module" src="app.js"></script></body></html>
